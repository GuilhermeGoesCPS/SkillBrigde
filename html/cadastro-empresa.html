<!DOCTYPE html>
<html lang="pt-br">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>SkillBridge | Cadastro - Empresa</title>
	<link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

<!-- Cabeçalho -->
<header id="site-header" data-base="../"></header>

<!-- Página -->
<main class="auth-page">
    <section class="auth-card">

        <h1>Cadastro</h1>

         <!-- Abas -->
        <div class="auth-switch">

        <a href="cadastro-aluno.html">
            Aluno
        </a>

        <a class="active" href="cadastro-empresa.html">
            Empresa
        </a>
        </div>

        <!-- Formulário -->
        <form class="auth-form" id="form-cadastro" data-destino="login-empresa.html">

            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Digite o nome da empresa." autocomplete="organization" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="Digite o endereço de e-mail." autocomplete="email" required>

            <label for="cnpj">CNPJ</label>
            <input type="text" id="cnpj" name="cnpj" placeholder="Digite o CNPJ da empresa." autocomplete="username" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Digite a sua senha" autocomplete="new-password" required>

            <label for="confirmar-senha">Confirmar Senha</label>
            <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Repita a sua senha" autocomplete="new-password" required>

            <button type="submit" class="button-primary">Cadastre-se</button>
        </form>

        <p class="auth-link">
            Já possui conta?
            <a href="login-empresa.html">Entrar</a>
        </p>
    </section>
</main>

<!-- Rodapé -->
<footer id="site-footer"></footer>

<script src="../js/main.js"></script>
<script src="../js/cadastro.js"></script>

</body>

</html>
