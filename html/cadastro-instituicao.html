<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillBridge | Cadastro - Instituição</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<header id="site-header" data-base="../"></header>
<main class="auth-page">
    <section class="auth-card">
        <h1>Cadastro</h1>
        <div class="auth-switch">
            <a href="cadastro-aluno.html">Aluno</a>
            <a href="cadastro-empresa.html">Empresa</a>
            <a class="active" href="cadastro-instituicao.html">Instituição</a>
        </div>
        <form class="auth-form" id="form-cadastro" data-tipo="instituicao" data-destino="login-instituicao.html">
            <label for="nome">Nome da instituição</label>
            <input type="text" id="nome" name="nome" autocomplete="organization" maxlength="50" required>
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" autocomplete="email" maxlength="100" required>
            <label for="cnpj">CNPJ</label>
            <input type="text" id="cnpj" name="cnpj" placeholder="14 dígitos, somente números." inputmode="numeric" pattern="[0-9]{14}" minlength="14" maxlength="14" required>
            <label for="endereco">Endereço</label>
            <input type="text" id="endereco" name="endereco" autocomplete="street-address" required>
            <label for="descricao">Sobre a instituição</label>
            <textarea id="descricao" name="descricao" rows="3"></textarea>
            <label for="contato">Contato</label>
            <input type="text" id="contato" name="contato" autocomplete="tel">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Mínimo de 10 caracteres" autocomplete="new-password" minlength="10" required>
            <label for="confirmar-senha">Confirmar senha</label>
            <input type="password" id="confirmar-senha" name="confirmar-senha" autocomplete="new-password" required>
            <button type="submit" class="button-primary">Cadastre-se</button>
            <p id="mensagem-formulario" class="status-message" role="status" hidden></p>
        </form>
        <p class="auth-link">Já possui conta? <a href="login-instituicao.html">Entrar</a></p>
    </section>
</main>
<footer id="site-footer"></footer>
<script src="../js/api.js"></script>
<script src="../js/main.js"></script>
<script src="../js/cadastro.js"></script>
</body>
</html>
