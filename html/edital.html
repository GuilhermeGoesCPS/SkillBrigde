<!DOCTYPE html>
<html lang="pt-br">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>SkillBridge | Edital</title>
	<link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

<!-- Cabeçalho -->
<header id="site-header" data-base="../"></header>

<!-- Página -->
<main>
    <section class="menu-edital">
        <div class="topo-edital">
            <div><p class="eyebrow-vaga">OPORTUNIDADES</p><h1>Edital de Vagas</h1></div>
            <div class="acoes-edital">
                <div class="searchbox-edital"><img class="icons" id="pesquisa-edital" src="../assets/icons/icone-pesquisa.svg" alt=""><input id="busca-vagas" type="search" placeholder="Pesquisar vagas..." aria-label="Pesquisar vagas"></div>
                <div class="filtros-edital">
                    <select id="filtro-categoria" aria-label="Filtrar por área"><option value="">Carregando áreas...</option></select>
                    <select id="filtro-tipo" aria-label="Filtrar por tipo"><option value="">Todos os tipos</option></select>
                </div>
            </div>
        </div>
        <div class="linha-edital"></div>
        <div id="filtros-tags" class="tags-edital" aria-label="Filtrar por competência"></div>
    </section>
    <section class="results-heading"><p id="quantidade-vagas" aria-live="polite"></p><p id="mensagem-vagas" class="status-message" role="status" hidden></p></section>
    <section id="lista-vagas" class="grid-vagas" aria-live="polite"></section>
</main>

<!-- Rodapé -->
<footer id="site-footer"></footer>

<script src="../js/api.js"></script>
<script src="../js/main.js"></script>
<script src="../js/filtros.js"></script>

</body>

</html>
