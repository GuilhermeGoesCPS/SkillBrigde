<!DOCTYPE html>
<html lang="pt-br">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>SkillBridge | Login - Empresa</title>
	<link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

<!-- Cabeçalho -->
<header id="site-header" data-base="../"></header>

<!-- Página -->
<main class="auth-page">
    <section class="auth-card">
        <h1>Login</h1>

        <!-- Abas -->
        <div class="auth-switch">

        <a href="login-aluno.html">
            Aluno
        </a>

        <a class="active" href="login-empresa.html">
            Empresa
        </a>
        </div>

        <!-- Formulário -->
        <form class="auth-form" id="form-login" data-destino="../index.html">

            <label for="cnpj">CNPJ</label>
            <input type="text" id="cnpj" name="cnpj" placeholder="Digite o CNPJ." autocomplete="username" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha." autocomplete="current-password" required>

            <div class="auth-options">
                <div class="checkbox-group">
                    <input type="checkbox" id="remember" name="lembrar">
                    <label for="remember">
                        Lembrar de mim
                    </label>
                </div>

                <a href="#">Esqueci minha senha</a>
            </div>

            <button type="submit" class="button-primary">Acessar</button>
        </form>
        
        <p class="auth-link">
            Não possui conta?
            <a href="cadastro-empresa.html">Cadastre-se</a>
        </p>
    </section>
</main>

<!-- Rodapé -->
<footer id="site-footer"></footer>

<script src="../js/main.js"></script>
<script src="../js/login.js"></script>

</body>

</html>
